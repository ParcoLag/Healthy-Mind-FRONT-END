<!DOCTYPE html>
<!-- HealthyMind - Iniciar sesión | Front-end con Bootstrap 5 | SENA ADSO -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthyMind - Iniciar sesión</title>
  <!-- Framework Bootstrap (estilos) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Estilos propios del proyecto -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <main class="container py-4">
    <!-- Tarjeta de inicio de sesión, centrada -->
    <div class="mx-auto text-center" style="max-width: 430px;">
      <div class="logo-icono mb-2">♥</div>
      <div class="marca fs-2">HEALTHY<span>MIND</span></div>
      <p class="text-secondary">Tu espacio para cuidar tu bienestar.</p>

      <div class="card tarjeta text-start">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold">Iniciar sesión</h1>
          <p class="text-secondary">Ingresa a tu cuenta para continuar.</p>

          <!-- Formulario con validación de Bootstrap (se procesa en js/app.js) -->
          <form id="formLogin" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="usuario" class="form-label fw-semibold">Usuario o correo electrónico</label>
              <input type="text" class="form-control" id="usuario" required>
              <div class="invalid-feedback">Escribe tu usuario o correo.</div>
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label fw-semibold">Contraseña</label>
              <input type="password" class="form-control" id="clave" required>
              <div class="invalid-feedback">Escribe tu contraseña.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
          </form>

          <p class="text-center small mt-3 mb-1"><a href="#">¿No tienes una cuenta? Regístrate</a></p>
          <p class="text-center small mb-0"><a href="#">¿Olvidaste tu contraseña?</a></p>
        </div>
      </div>
      <p class="small text-secondary mt-3">TÉRMINOS Y CONDICIONES | POLÍTICA DE PRIVACIDAD</p>
    </div>
  </main>


  <!-- Bootstrap (comportamiento) y script propio -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
